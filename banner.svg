<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Duan Gómez — Desarrollador de Software Full-Stack">
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0aa5ff"/>
<stop offset="55%" stop-color="#6c5ce7"/>
<stop offset="100%" stop-color="#a855f7"/>
</linearGradient>
<radialGradient id="glow1" cx="0.82" cy="0.15" r="0.55">
<stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="0.12" cy="1" r="0.5">
<stop offset="0%" stop-color="#0aa5ff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#0aa5ff" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
</pattern>
<style>
.t { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
.m { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.rise { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</defs>

<rect width="1200" height="320" rx="24" fill="#0b1020"/>
<rect width="1200" height="320" rx="24" fill="url(#dots)"/>
<rect width="1200" height="320" rx="24" fill="url(#glow1)"/>
<rect width="1200" height="320" rx="24" fill="url(#glow2)"/>
<rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

<!-- status pill -->
<g class="rise">
<rect x="72" y="58" width="236" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<circle cx="94" cy="75" r="5" fill="#34d399"/>
<text x="108" y="80" class="t" font-size="15" font-weight="500" fill="#d6dcf5">Disponible para trabajar</text>
</g>

<text x="72" y="160" class="t rise d1" font-size="64" font-weight="800" letter-spacing="-2" fill="#ffffff">Hola, soy <tspan fill="url(#grad)">Duan Gómez</tspan></text>

<text x="74" y="208" class="t rise d2" font-size="24" font-weight="500" fill="#aab3d6">Desarrollador de Software Full-Stack · Medellín, Colombia</text>

<g class="rise d3">
<text x="74" y="262" class="m" font-size="18" fill="#6c7bb0">&gt; <tspan fill="#0aa5ff">angular</tspan> · <tspan fill="#6c5ce7">spring boot</tspan> · <tspan fill="#a855f7">node.js</tspan> · <tspan fill="#0aa5ff">typescript</tspan> · fundador de <tspan fill="#ffffff" font-weight="700">Dcodea</tspan><tspan class="cursor" fill="#a855f7" font-weight="700">_</tspan></text>
</g>

<!-- code brackets mark -->
<g transform="translate(985 92)" opacity="0.9">
<text x="0" y="110" class="m" font-size="132" font-weight="700" fill="url(#grad)">{ }</text>
</g>
</svg>
